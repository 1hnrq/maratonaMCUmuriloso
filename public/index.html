<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCU — Ordem Cronológica</title>



<style>
  :root{
    --bg:#0c0c0e; --panel:#151517; --ink:#f2efe9; --sub:#9a938c;
    --line:#2a2a2d; --red:#d3242c; --red-dim:#7a1418; --gold:#e8b23d; --done:#2c8a52;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eeece6; --panel:#ffffff; --ink:#17140f; --sub:#6d665d;
      --line:#d9d3c7; --red:#c11f26; --red-dim:#7a1418; --gold:#a8791f; --done:#1f6e42;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0c0e; --panel:#151517; --ink:#f2efe9; --sub:#9a938c;
    --line:#2a2a2d; --red:#d3242c; --red-dim:#7a1418; --gold:#e8b23d; --done:#2c8a52;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 1.6px) 0 0/16px 16px,
      var(--bg);
    color:var(--ink);
    font-family:'Barlow Condensed',Verdana,Geneva,sans-serif;
    display:flex; justify-content:center;
    padding:28px 14px 60px;
  }
  .wrap{width:100%; max-width:640px;}

  .banner{
    background:var(--red);
    color:#fff;
    padding:18px 20px 16px;
    border-radius:10px;
    box-shadow:0 6px 0 var(--red-dim), 0 10px 24px rgba(0,0,0,.35);
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .banner::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,0.08) 0 10px, transparent 10px 26px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Anton',sans-serif;
    font-size:13px; letter-spacing:2px;
    color:rgba(255,255,255,.75);
    margin:0 0 2px;
  }
  h1{
    font-family:'Anton',sans-serif;
    font-size:32px; line-height:1.02; margin:0;
    letter-spacing:.5px;
    text-shadow:2px 2px 0 rgba(0,0,0,.25);
  }

  .meta{
    color:var(--sub); font-size:14.5px;
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    margin:16px 2px 8px;
  }
  .meta .count{
    font-family:'Anton',sans-serif; color:var(--gold); font-size:16px; letter-spacing:.5px;
  }
  .progress-track{
    height:10px; border-radius:5px; background:var(--panel); border:1px solid var(--line);
    margin:0 2px 22px; overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--red), var(--gold));
    width:0%; transition:width .4s ease;
  }

  ul.list{list-style:none; margin:0; padding:0;}
  li{
    display:flex; align-items:flex-start; gap:14px;
    padding:13px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--red-dim);
    border-radius:6px;
    margin-bottom:9px;
    cursor:pointer; user-select:none;
    transition:border-color .15s, background .15s;
  }
  li:hover{ border-left-color:var(--red); }
  li .num{
    font-family:'Anton',sans-serif; font-size:15px; color:var(--sub);
    width:26px; padding-top:2px; flex-shrink:0; text-align:right;
  }
  .box{
    width:24px; height:24px; border-radius:5px; border:2px solid var(--sub);
    flex-shrink:0; margin-top:1px; position:relative; transition:background .15s, border-color .15s;
    transform:rotate(0deg);
  }
  .box svg{
    position:absolute; inset:0; margin:auto; width:15px; height:15px;
    opacity:0; transition:opacity .12s;
  }
  li.done{ border-left-color:var(--done); background:color-mix(in srgb, var(--done) 10%, var(--panel)); }
  li.done .box{ background:var(--done); border-color:var(--done); }
  li.done .box svg{ opacity:1; }
  .txt{flex:1; min-width:0; padding-top:1px;}
  .title{font-size:17.5px; line-height:1.28; font-weight:600; letter-spacing:.2px;}
  .year{font-size:13px; color:var(--sub); margin-top:1px; font-variant-numeric:tabular-nums;}
  li.done .title{ color:var(--sub); text-decoration:line-through; text-decoration-color:var(--line); font-weight:500; }

  footer{
    margin-top:20px; display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--sub); padding:0 2px;
  }
  button{
    background:transparent; border:1.5px solid var(--red-dim); color:var(--red);
    font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.5px;
    padding:8px 14px; border-radius:6px; cursor:pointer;
  }
  button:hover{ background:var(--red); color:#fff; border-color:var(--red); }
</style>

s-fill{background:linear-gradient(90deg,#ed1d24,#ff9669)}.heading{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:21px}.heading span{color:var(--red)}.toolbar{display:flex;justify-content:space-between;gap:14px;margin:0 0 18px}.filters{display:flex;gap:5px}.filters button{font:600 12px 'Segoe UI',sans-serif;border:1px solid var(--line);color:var(--sub);padding:10px 16px}.filters button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:white}input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;color:white;font:13px 'Segoe UI',sans-serif;width:260px}ul.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}li{margin:0;min-height:91px;border-left:3px solid #59313a;align-items:center;padding:18px 15px;gap:13px;border-radius:5px}li:hover{background:#1c222d;border-color:#99505a}li .num{font:800 21px 'Segoe UI',sans-serif;color:#677185;width:28px;padding:0;text-align:left}.box{width:22px;height:22px;border-width:1.5px;border-color:#647087}.title{font:600 14px/1.4 'Segoe UI',sans-serif}.year{font:11px 'Segoe UI',sans-serif;margin-top:7px}li.done{background:linear-gradient(110deg,#172b24,#141b20);border-color:#305744}li.done .title{color:#a7cbbb;text-decoration:none;font-weight:600}.box svg{stroke:white}.next{margin-top:22px;padding:18px 20px;background:linear-gradient(90deg,#8b62221f,transparent);border:1px solid #65523166;border-radius:6px}.next small{display:block;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:7px}#next{font-size:13px}footer{margin-top:24px;padding:20px 0;border-bottom:1px solid var(--line);font-size:11px}footer button{font:600 11px 'Segoe UI',sans-serif;color:#e8b0b3;padding:10px 14px}.note{text-align:center;color:#8d97a8;font-size:10px;line-height:1.8;letter-spacing:1px;margin-top:23px}.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:30px;border:1px dashed var(--line)}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(max-width:700px){body{padding:0 18px 30px}.top small{font-size:9px;letter-spacing:1.5px}.banner{padding:30px 0}.shield{right:-110px;opacity:.22}.banner h1{font-size:46px}.intro{max-width:340px}.meta{padding:16px;gap:20px}.meta>span:first-child{max-width:220px;line-height:1.5}.toolbar{flex-direction:column}.filters button{flex:1;padding:10px}.toolbar input{width:100%}ul.list{grid-template-columns:1fr}li{min-height:85px}.meta .count{font-size:24px;white-space:nowrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
